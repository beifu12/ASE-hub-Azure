name: ASE Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Setup test data
        run: |
          mkdir -p app/data
          echo '{"availability":{"cn":"可用性","scene":"计算→可靠性","phonetic":""}}' > app/data/azure_glossary.json
      - name: Run tests
        run: |
          cd app && python -m pytest tests/ -v

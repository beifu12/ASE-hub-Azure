<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASE Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .auth-container h1 { text-align: center; margin-bottom: 8px; }
        .auth-container .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; font-size: 14px; }
        .auth-container .form-group { margin-bottom: 16px; }
        .auth-container label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .auth-container input {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg); color: var(--text);
            font-size: 14px; box-sizing: border-box;
        }
        .auth-container input:focus { outline: none; border-color: var(--accent); }
        .auth-container .btn { width: 100%; padding: 12px; margin-top: 8px; font-size: 15px; }
        .auth-container .error { color: #f87171; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        .auth-container .switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary); }
        .auth-container .switch a { color: var(--accent); text-decoration: none; }
        .logo-text { text-align: center; font-size: 28px; font-weight: 800; margin-bottom: 4px; }
        .logo-text span { color: var(--accent); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-text">ASE<span>Hub</span></div>
        <p class="subtitle">Azure Solutions Engineer Hub</p>
        <h1>登录</h1>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">登 录</button>
        <div class="error" id="error"></div>
        <div class="switch">
            还没有账号？<a href="/register">立即注册</a>
        </div>
    </div>

    <script>
        const API = '/api';

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            errorEl.style.display = 'none';

            if (!username || !password) {
                errorEl.textContent = '请填写用户名和密码';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const resp = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    errorEl.textContent = data.detail || '登录失败';
                    errorEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('ase_token', data.access_token);
                localStorage.setItem('ase_user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (e) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.style.display = 'block';
            }
        }

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // Redirect if already logged in
        if (localStorage.getItem('ase_token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>

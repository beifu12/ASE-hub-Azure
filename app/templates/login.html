<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASE Hub · 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #E0EDF9 0%, #F0F6FC 40%, #FFFFFF 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 44px 40px 36px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0px 0px 0px 1px rgba(0,0,0,0.06), 0px 4px 8px rgba(0,0,0,0.04), 0px 12px 24px -8px rgba(0,0,0,0.08);
        }
        .login-brand {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.3px;
            color: #1A1A2E;
            margin-bottom: 2px;
        }
        .login-brand span { color: #0078D4; }
        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #5E6C84;
            margin-bottom: 32px;
            font-weight: 400;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #5E6C84;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #FFFFFF;
            border: 1px solid #C0C7D0;
            border-radius: 6px;
            color: #1A1A2E;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0078D4;
            box-shadow: 0 0 0 3px rgba(0,120,212,0.12);
        }
        .form-group input::placeholder { color: #9BA6B9; }
        .btn-login {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: #0078D4;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
            letter-spacing: 0.2px;
        }
        .btn-login:hover { background: #106EBE; }
        .btn-login:active { transform: scale(0.98); }
        .error-msg {
            color: #D13438;
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            display: none;
            background: #FDE7E8;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .footer-text {
            text-align: center;
            color: #9BA6B9;
            font-size: 12px;
            margin-top: 24px;
        }
        .input-icon {
            position: relative;
        }
        .input-icon .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.4;
            pointer-events: none;
        }
        .input-icon input { padding-left: 36px; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-brand">ASE<span>Hub</span></div>
    <p class="login-subtitle">Azure Solutions Engineer Hub</p>

    <div class="form-group">
        <label>用户名</label>
        <div class="input-icon">
            <span class="icon">👤</span>
            <input type="text" id="username" placeholder="输入用户名" autocomplete="username" autofocus>
        </div>
    </div>
    <div class="form-group">
        <label>密码</label>
        <div class="input-icon">
            <span class="icon">🔒</span>
            <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
        </div>
    </div>

    <button class="btn-login" onclick="handleLogin()">登 录</button>
    <div class="error-msg" id="error"></div>
    <p class="footer-text">私有实例 · 仅授权用户</p>
</div>

<script>
    const API = '/api';

    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error');
        const btn = document.querySelector('.btn-login');

        errorEl.style.display = 'none';
        if (!username || !password) {
            errorEl.textContent = '请填写用户名和密码';
            errorEl.style.display = 'block';
            return;
        }

        btn.textContent = '登录中…';
        btn.style.opacity = '0.7';

        try {
            const resp = await fetch(API + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            const data = await resp.json();

            if (!resp.ok) {
                errorEl.textContent = data.detail || '用户名或密码错误';
                errorEl.style.display = 'block';
                btn.textContent = '登 录';
                btn.style.opacity = '1';
                return;
            }

            localStorage.setItem('ase_token', data.access_token);
            localStorage.setItem('ase_user', JSON.stringify(data.user));
            window.location.href = '/';
        } catch (e) {
            errorEl.textContent = '网络错误，请重试';
            errorEl.style.display = 'block';
            btn.textContent = '登 录';
            btn.style.opacity = '1';
        }
    }

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });

    if (localStorage.getItem('ase_token')) window.location.href = '/';
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASE Hub · 翻译</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .translator-container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .translator-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .translator-header {
            padding: 24px 32px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .translator-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #e6edf3;
            margin: 0;
        }
        .lang-selector {
            display: flex;
            gap: 4px;
            background: #0d1117;
            border-radius: 6px;
            padding: 2px;
        }
        .lang-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: #8b949e;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .lang-btn.active {
            background: #0078d4;
            color: #fff;
        }
        .translator-body {
            padding: 24px 32px;
        }
        .translator-body textarea {
            width: 100%;
            min-height: 180px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            color: #e6edf3;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .translator-body textarea:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0,120,212,0.15);
        }
        .translator-body textarea::placeholder {
            color: #484f58;
        }
        .translator-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
        }
        .btn-translate {
            padding: 10px 28px;
            background: linear-gradient(135deg, #0078d4, #1a8fe3);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-translate:hover { opacity: 0.9; }
        .btn-translate:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-clear {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-clear:hover { border-color: #484f58; color: #c9d1d9; }
        .char-count {
            margin-left: auto;
            color: #484f58;
            font-size: 12px;
        }
        .result-section {
            margin-top: 28px;
            border-top: 1px solid #21262d;
            padding: 24px 32px;
            display: none;
        }
        .result-section.show { display: block; }
        .result-label {
            font-size: 12px;
            font-weight: 600;
            color: #0078d4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .result-text {
            color: #e6edf3;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .result-meta {
            margin-top: 12px;
            font-size: 12px;
            color: #484f58;
            display: flex;
            gap: 16px;
        }
        .error-text {
            color: #f87171;
            font-size: 14px;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="dark">

<!-- Top Bar -->
<header class="topbar">
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <a class="topbar-brand" href="/">ASE Hub</a>
    <div class="topbar-search">
        <input type="text" placeholder="Search resources, tools, docs... (Cmd+K)" class="search-input" disabled>
    </div>
    <div class="topbar-actions">
        <button class="topbar-btn" title="Notifications">🔔</button>
        <a href="/translator" class="topbar-btn" title="Translate">🌐</a>
        <button class="topbar-btn" onclick="window.location.href='/logout'">Logout</button>
    </div>
</header>

<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-group-title">⭐ FAVORITES</div>
                <a class="nav-item" href="/">📊 Dashboard</a>
                <a class="nav-item" href="/glossary">📖 Glossary</a>
                <a class="nav-item active" href="/translator">🌐 Translate</a>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">📋 RECENT</div>
                <div id="nav-recent"></div>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">🔗 LINKS</div>
                <a class="nav-item" href="/updates">📡 Updates</a>
                <a class="nav-item" href="/reports">📋 Reports</a>
                <a class="nav-item" href="/snippets">📝 Snippets</a>
                <a class="nav-item" href="/meetings">🤝 Meetings</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <button class="lang-btn-en" onclick="setLang('en')">EN</button>
            <button class="lang-btn-zh" onclick="setLang('zh')">中文</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div class="translator-container">
            <div class="translator-card">
                <div class="translator-header">
                    <h2>🌐 通用翻译</h2>
                    <div class="lang-selector">
                        <button class="lang-btn active" onclick="setDirection('en2zh', this)">EN → 中文</button>
                        <button class="lang-btn" onclick="setDirection('zh2en', this)">中文 → EN</button>
                    </div>
                </div>
                <div class="translator-body">
                    <textarea id="inputText" placeholder="输入要翻译的英文内容…&#10;&#10;支持邮件、文章、段落等"></textarea>
                    <div class="translator-actions">
                        <button class="btn-translate" id="translateBtn" onclick="doTranslate()">翻 译</button>
                        <button class="btn-clear" onclick="clearAll()">清空</button>
                        <span class="char-count" id="charCount">0 / 500</span>
                    </div>
                </div>
                <div class="result-section" id="resultSection">
                    <div class="result-label">翻译结果</div>
                    <div class="result-text" id="resultText"></div>
                    <div class="result-meta" id="resultMeta"></div>
                </div>
            </div>
            <p style="text-align:center; color:#484f58; margin-top:20px; font-size:12px;">
                翻译引擎：MyMemory · 免费匿名使用 · 每次最长 500 字符
            </p>
        </div>
    </main>
</div>

<script>
const API = '/api';
let direction = 'en2zh';
let currentLang = localStorage.getItem('ase_lang') || 'en';

function setDirection(dir, btn) {
    direction = dir;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const ph = dir === 'en2zh' ? '输入要翻译的英文内容…' : '输入要翻译的中文内容…';
    document.getElementById('inputText').placeholder = ph + '\n\n支持邮件、文章、段落等';
}

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('ase_lang', lang);
    window.location.reload();
}

document.getElementById('inputText').addEventListener('input', e => {
    document.getElementById('charCount').textContent = e.target.value.length + ' / 500';
});

async function doTranslate() {
    const text = document.getElementById('inputText').value.trim();
    const btn = document.getElementById('translateBtn');
    const resultSection = document.getElementById('resultSection');
    const resultText = document.getElementById('resultText');
    const resultMeta = document.getElementById('resultMeta');

    if (!text) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>翻译中…';
    resultSection.classList.add('show');
    resultText.textContent = '翻译中…';
    resultMeta.textContent = '';

    const endpoint = direction === 'en2zh' ? '/translate/zh' : '/translate/en';
    const token = localStorage.getItem('ase_token');

    try {
        const resp = await fetch(API + endpoint + '?q=' + encodeURIComponent(text), {
            headers: token ? { Authorization: 'Bearer ' + token } : {}
        });
        const data = await resp.json();

        if (data.error) {
            resultText.innerHTML = '<span class="error-text">❌ ' + data.error + '</span>';
        } else {
            resultText.textContent = data.translated;
            resultMeta.textContent = '质量: ' + data.quality + '% · 来源: ' + data.source;
        }
    } catch (e) {
        resultText.innerHTML = '<span class="error-text">❌ 网络错误，请重试</span>';
    }

    btn.disabled = false;
    btn.textContent = '翻 译';
}

function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('charCount').textContent = '0 / 500';
    document.getElementById('resultSection').classList.remove('show');
}

// Keyboard shortcut: Ctrl+Enter
document.getElementById('inputText').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') doTranslate();
});

// Sidebar toggle
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('main-content').classList.toggle('expanded');
}

// Load recent from localStorage
(function() {
    const recent = JSON.parse(localStorage.getItem('ase_recent') || '[]');
    const container = document.getElementById('nav-recent');
    recent.slice(0, 5).forEach(item => {
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.href = item.href;
        a.textContent = item.label;
        container.appendChild(a);
    });
})();
</script>
</body>
</html>
